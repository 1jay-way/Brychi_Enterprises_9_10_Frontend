<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brychi Product Importer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: #1565c0;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #loginBox,
    #importBox {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    #importBox {
      display: none;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    #userInfo {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <h1>Brychi Product Importer</h1>

  <!-- LOGIN -->
  <div id="loginBox">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your Firebase password"
    >

    <button id="loginBtn">
      Login
    </button>

  </div>

  <!-- IMPORT -->
  <div id="importBox">

    <h2>Import Products</h2>

    <div id="userInfo"></div>

    <input
      type="file"
      id="file"
      accept=".json,application/json"
    >

    <button id="importBtn">
      Import Products
    </button>

    <button id="logoutBtn">
      Logout
    </button>

  </div>

  <div id="status">
    Please log in first.
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      setDoc
    }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyCM-JZA63wNyzYM4C3vaUiciwYOmWd6Vhc",
      authDomain: "brychim-enterprises2.firebaseapp.com",
      projectId: "brychim-enterprises2",
      storageBucket: "brychim-enterprises2.firebasestorage.app",
      messagingSenderId: "596161124096",
      appId: "1:596161124096:web:8f48278c43db2891a305e5"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginBox =
      document.getElementById("loginBox");

    const importBox =
      document.getElementById("importBox");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const fileInput =
      document.getElementById("file");

    const importBtn =
      document.getElementById("importBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const status =
      document.getElementById("status");

    const userInfo =
      document.getElementById("userInfo");


    // ==========================================
    // ADMIN UID LIST
    // ==========================================

    const ADMIN_UIDS = [
      "ymO4HaL6qvfNZSjrNUT4GozVyh03",
      "aB3utioU6qbDq8N2xNaJm3cjTez2"
    ];


    // ==========================================
    // LOGIN
    // ==========================================

    loginBtn.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {

        status.textContent =
          "❌ Enter your email and password.";

        return;
      }

      loginBtn.disabled = true;

      status.textContent =
        "Logging in...";

      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user =
          result.user;


        // Check that this account is an authorized admin

        if (!ADMIN_UIDS.includes(user.uid)) {

          await signOut(auth);

          throw new Error(
            "This Firebase account is not authorized as an admin."
          );
        }


        status.textContent =
          "✅ Login successful.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Login failed: " +
          error.message;

      } finally {

        loginBtn.disabled = false;

      }

    });


    // ==========================================
    // AUTH STATE
    // ==========================================

    onAuthStateChanged(auth, user => {

      if (user && ADMIN_UIDS.includes(user.uid)) {

        loginBox.style.display = "none";

        importBox.style.display = "block";

        userInfo.textContent =
          "Logged in as: " + user.email;

        status.textContent =
          "✅ You are logged in. Select the JSON file.";

      } else {

        loginBox.style.display = "block";

        importBox.style.display = "none";

        userInfo.textContent = "";

      }

    });


    // ==========================================
    // IMPORT PRODUCTS
    // ==========================================

    importBtn.addEventListener("click", async () => {

      const file =
        fileInput.files[0];

      if (!file) {

        status.textContent =
          "❌ Please select brychi-lotaja-products-fixed.json first.";

        return;
      }


      const currentUser =
        auth.currentUser;

      if (!currentUser) {

        status.textContent =
          "❌ You are not logged in.";

        return;
      }


      if (!ADMIN_UIDS.includes(currentUser.uid)) {

        status.textContent =
          "❌ Your account is not authorized.";

        return;
      }


      importBtn.disabled = true;

      try {

        status.textContent =
          "Reading JSON file...";


        const text =
          await file.text();

        const data =
          JSON.parse(text);


        // Accept Stage 1.5 format:
        // {
        //   source: "...",
        //   totalProducts: 32,
        //   products: [...]
        // }

        const products =
          Array.isArray(data)
            ? data
            : data.products;


        if (!Array.isArray(products)) {

          throw new Error(
            "JSON does not contain a valid products array."
          );

        }


        status.textContent =
          `Found ${products.length} products.\nStarting import...`;


        let imported = 0;


        for (const product of products) {

          const productRef =
            doc(collection(db, "products"));


          const productData = {

            name:
              product.name || "",

            price:
              product.price ?? null,

            description:
              product.description || "",

            image:
              product.image || "",

            sourceUrl:
              product.sourceUrl || "",

            active:
              product.active !== false,

            sortOrder:
              product.sortOrder || imported + 1

          };


          if (product.priceType) {

            productData.priceType =
              product.priceType;

            productData.priceMin =
              product.priceMin ?? null;

            productData.priceMax =
              product.priceMax ?? null;

          }


          await setDoc(
            productRef,
            productData
          );


          imported++;


          status.textContent =
            `Importing...\n${imported} / ${products.length} products completed.`;

        }


        status.textContent =
          `✅ IMPORT COMPLETE!\n\n${imported} products successfully imported into Firestore.`;

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Import failed:\n" +
          error.message;

      } finally {

        importBtn.disabled = false;

      }

    });


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener("click", async () => {

      await signOut(auth);

      status.textContent =
        "Logged out.";

    });

  </script>

</body>
</html>
