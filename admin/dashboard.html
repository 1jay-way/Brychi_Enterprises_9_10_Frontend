<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Brychi Admin — Dashboard</title>

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body class="admin-body">



<!-- =====================================================
     ADMIN HEADER
===================================================== -->

<header class="admin-header">


  <!-- BRAND -->

  <a
    class="admin-brand"
    href="dashboard.html"
  >

    <span class="admin-mark small">
      BE
    </span>

    <span>
      Brychi Admin
    </span>

  </a>



  <!-- HEADER ACTIONS -->

  <div class="admin-actions">


    <span
      id="admin-email"
      class="admin-user"
    ></span>


    <!-- VIEW PUBLIC SHOP -->

    <a
      class="ghost-btn"
      href="../shop.html"
      target="_blank"
      rel="noopener"
    >

      View Shop

    </a>


    <!-- LOGOUT -->

    <button
      id="logout-btn"
      class="ghost-btn"
      type="button"
    >

      Log Out

    </button>


  </div>


</header>



<!-- =====================================================
     MAIN DASHBOARD
===================================================== -->

<main class="admin-main">



  <!-- DASHBOARD TITLE -->

  <section class="dashboard-heading">


    <div>

      <p class="eyebrow">
        PRODUCT MANAGEMENT
      </p>


      <h1>
        Products Dashboard
      </h1>


      <p class="muted">

        Upload and manage the Brychi
        Enterprises product catalogue.

      </p>

    </div>



    <!-- PRODUCT COUNT -->

    <div class="stats-card">

      <span>
        Total products
      </span>


      <strong id="product-count">
        0
      </strong>

    </div>


  </section>




  <!-- ===================================================
       TWO-COLUMN DASHBOARD
  ==================================================== -->

  <section class="dashboard-grid">



    <!-- =================================================
         ADD / EDIT PRODUCT
    ================================================== -->

    <div class="panel">


      <div class="panel-heading">


        <div>

          <p class="eyebrow">
            CATALOGUE
          </p>


          <h2 id="form-title">
            Add Product
          </h2>

        </div>



        <button
          id="cancel-edit"
          class="text-btn hidden"
          type="button"
        >

          Cancel edit

        </button>


      </div>




      <!-- PRODUCT FORM -->

      <form
        id="product-form"
        class="admin-form"
      >


        <!-- PRODUCT ID -->

        <input
          id="product-id"
          type="hidden"
        >



        <!-- PRODUCT NAME -->

        <label>

          Product name

          <input
            id="product-name"
            type="text"
            required
            placeholder="Quantum Energy Device"
          >

        </label>



        <!-- PRICE -->

        <label>

          Price (₦)

          <input
            id="product-price"
            type="number"
            min="0"
            step="1"
            required
            placeholder="50000"
          >

        </label>



        <!-- DESCRIPTION -->

        <label>

          Description

          <textarea
            id="product-description"
            rows="5"
            required
            placeholder="Short product description..."
          ></textarea>

        </label>



        <!-- PRODUCT IMAGE -->

        <label>

          Product image

          <input
            id="product-image"
            type="file"
            accept="image/*"
          >

          <small>

            Upload a clear JPG, PNG or WebP image.

          </small>

        </label>



        <!-- IMAGE PREVIEW -->

        <div
          id="image-preview-wrap"
          class="image-preview-wrap hidden"
        >

          <img
            id="image-preview"
            class="image-preview"
            alt="Product preview"
          >

        </div>



        <!-- PRODUCT STATUS -->

        <label class="switch-row">


          <span>

            <strong>
              Available for sale
            </strong>

            <small>

              Turn this off to hide
              the product from customers.

            </small>

          </span>


          <input
            id="product-active"
            type="checkbox"
            checked
          >


        </label>



        <!-- MESSAGE -->

        <p
          id="product-message"
          class="form-message"
          role="alert"
        ></p>



        <!-- SAVE -->

        <button
          id="save-product"
          class="primary-btn"
          type="submit"
        >

          Save Product

        </button>


      </form>


    </div>




    <!-- =================================================
         PRODUCT LIST
    ================================================== -->

    <div class="panel">


      <div class="panel-heading">


        <div>

          <p class="eyebrow">
            INVENTORY
          </p>


          <h2>
            Your Products
          </h2>

        </div>


      </div>



      <!-- SEARCH -->

      <div class="toolbar">

        <input
          id="product-search"
          type="search"
          placeholder="Search products..."
        >

      </div>



      <!-- PRODUCTS WILL APPEAR HERE -->

      <div
        id="product-list"
        class="product-admin-list"
      >

        <div class="empty-state">

          Loading products...

        </div>

      </div>



      <!-- PAGINATION -->

      <div
        id="pagination"
        class="pagination"
      ></div>


    </div>


  </section>


</main>



<!-- ADMIN JAVASCRIPT -->

<script
  type="module"
  src="admin.js"
></script>


</body>

</html>
