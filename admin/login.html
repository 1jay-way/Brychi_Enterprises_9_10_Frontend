<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Brychi Admin — Login</title>

  <link
    rel="stylesheet" 
  
    href="admin.css"
  >

</head>


<body class="admin-body">


  <main class="login-shell">


    <section class="login-card">


      <!-- ADMIN LOGO -->

      <div class="admin-mark">
        BE
      </div>


      <!-- BRAND NAME -->

      <p class="eyebrow">
        BRYCHI ENTERPRISES
      </p>


      <h1>
        Admin Portal
      </h1>


      <p class="muted">
        Sign in to manage products, prices,
        images and availability.
      </p>



      <!-- LOGIN FORM -->

      <form
        id="login-form"
        class="admin-form"
      >


        <!-- EMAIL -->

        <label>

          Email

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
            placeholder="admin@email.com"
          >

        </label>



        <!-- PASSWORD -->

        <label>

          Password

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          >

        </label>



        <!-- ERROR / SUCCESS MESSAGE -->

        <p
          id="login-message"
          class="form-message"
          role="alert"
        ></p>



        <!-- LOGIN BUTTON -->

        <button
          class="primary-btn"
          type="submit"
        >

          Sign In

        </button>


      </form>



      <!-- BACK TO WEBSITE -->

      <a
        class="back-link"
        href="../index.html"
      >

        ← Back to website

      </a>


    </section>


  </main>


  <!-- FIREBASE / ADMIN JAVASCRIPT -->

  <script
    type="module"
    src="admin.js"
  ></script>


</body>

</html>
